services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos_web}
      POSTGRES_USER: ${POSTGRES_USER:-pos_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pos_data:/var/lib/postgresql
      - ./Database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./Database/02_rules.sql:/docker-entrypoint-initdb.d/02_rules.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pos_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pos_web}
    ports:
      - "127.0.0.1:${POS_WEB_PORT:-8000}:8000"

volumes:
  pos_data:

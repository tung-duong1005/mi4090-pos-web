<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 1097" width="1030" height="1097"><title>UC03 · Trả hàng và hoàn tiền</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#315773"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18374a}.title{font-size:24px;font-weight:bold}.msg{font-size:14px;paint-order:stroke;stroke:white;stroke-width:4px}.guard{font-size:14px;font-weight:bold}.head{font-size:16px;font-weight:bold;fill:white}.sub{font-size:15px}</style><rect width="100%" height="100%" fill="white"/><text x="22" y="35" class="title" text-anchor="start">UC03 · Trả hàng và hoàn tiền</text><text x="22" y="60" class="sub" text-anchor="start">TV1 · BR03 · Ca nhận trả có thể khác ca bán</text><path d="M115 114 V1029" stroke="#9caeba" stroke-dasharray="4 5"/><rect x="24" y="81" width="182" height="34" rx="6" fill="#1d7065"/><text x="115" y="104" class="head" text-anchor="middle">Thu ngân</text><path d="M350 114 V1029" stroke="#9caeba" stroke-dasharray="4 5"/><rect x="259" y="81" width="182" height="34" rx="6" fill="#24567a"/><text x="350" y="104" class="head" text-anchor="middle">QuayService</text><path d="M585 114 V1029" stroke="#9caeba" stroke-dasharray="4 5"/><rect x="494" y="81" width="182" height="34" rx="6" fill="#24567a"/><text x="585" y="104" class="head" text-anchor="middle">DongBan</text><path d="M820 114 V1029" stroke="#9caeba" stroke-dasharray="4 5"/><rect x="729" y="81" width="182" height="34" rx="6" fill="#24567a"/><text x="820" y="104" class="head" text-anchor="middle">Dữ liệu / PostgreSQL</text><rect x="30" y="379" width="970" height="86" rx="5" fill="none" stroke="#ab5743" stroke-width="1.4"/><rect x="30" y="571" width="970" height="86" rx="5" fill="none" stroke="#ab5743" stroke-width="1.4"/><rect x="18" y="293" width="994" height="497" rx="5" fill="none" stroke="#49857d" stroke-width="1.4"/><rect x="18" y="847" width="994" height="86" rx="5" fill="none" stroke="#ab5743" stroke-width="1.4"/><text x="232.5" y="146" class="msg" text-anchor="middle">tra(ma, ca, goc, pt, cac_dong)</text><path d="M115 163 H350" fill="none" stroke="#315773" stroke-width="1.6"  marker-end="url(#arr)"/><text x="585" y="195" class="msg" text-anchor="middle">BEGIN IMMEDIATE, kiểm quyền 03 và ca nhận trả</text><path d="M350 212 H820" fill="none" stroke="#315773" stroke-width="1.6"  marker-end="url(#arr)"/><text x="585" y="244" class="msg" text-anchor="middle">Tạo phieu_tra ở NHAP, tham chiếu phiếu gốc</text><path d="M350 261 H820" fill="none" stroke="#315773" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="19" y="294" width="992" height="26" rx="4" fill="#e0f0ed"/><text x="30" y="312" class="guard" text-anchor="start">LẶP  ·  Với mỗi dòng trả</text><text x="585" y="330" class="msg" text-anchor="middle">lay(DongBan, ma_dong) để truy dòng bán gốc</text><path d="M350 347 H820" fill="none" stroke="#315773" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="31" y="380" width="968" height="26" rx="4" fill="#f9eae4"/><text x="42" y="398" class="guard" text-anchor="start">DỪNG  ·  DongBan thuộc phiếu gốc khác</text><text x="585" y="416" class="msg" text-anchor="middle">Hoàn tác rồi trả lỗi sai phiếu gốc</text><path d="M350 433 H820" fill="none" stroke="#315773" stroke-width="1.6"  marker-end="url(#arr)"/><text x="585" y="473" class="msg" text-anchor="middle">Tổng lượng đã trả hiệu lực và dòng tạm cùng phiếu</text><path d="M350 490 H820" fill="none" stroke="#315773" stroke-width="1.6"  marker-end="url(#arr)"/><text x="467.5" y="522" class="msg" text-anchor="middle">luong_con_tra(da_tra)</text><path d="M350 539 H585" fill="none" stroke="#315773" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="31" y="572" width="968" height="26" rx="4" fill="#f9eae4"/><text x="42" y="590" class="guard" text-anchor="start">DỪNG  ·  Số lượng yêu cầu vượt lượng còn được trả</text><text x="585" y="608" class="msg" text-anchor="middle">giao_dich hoàn tác đầu phiếu và dòng đã ghi</text><path d="M350 625 H820" fill="none" stroke="#315773" stroke-width="1.6"  marker-end="url(#arr)"/><text x="585" y="665" class="msg" text-anchor="middle">Ghi lượng trả và tình trạng TOT hoặc HONG</text><path d="M350 682 H820" fill="none" stroke="#315773" stroke-width="1.6"  marker-end="url(#arr)"/><text x="455" y="714" class="msg" text-anchor="middle">Cộng lượng × (đơn giá gốc −</text><text x="455" y="731" class="msg" text-anchor="middle">giảm giá gốc)</text><path d="M350 748 h62 v13 h-62" fill="none" stroke="#315773" stroke-width="1.6"  marker-end="url(#arr)"/><text x="585" y="798" class="msg" text-anchor="middle">UPDATE tiền hoàn, chuyển XONG; trigger kiểm lại</text><path d="M350 815 H820" fill="none" stroke="#315773" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="19" y="848" width="992" height="26" rx="4" fill="#f9eae4"/><text x="30" y="866" class="guard" text-anchor="start">DỪNG  ·  Phiếu rỗng hoặc vi phạm ràng buộc khi chốt</text><text x="585" y="884" class="msg" text-anchor="middle">IntegrityError, giao dịch rollback</text><path d="M820 901 H350" fill="none" stroke="#315773" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="585" y="941" class="msg" text-anchor="middle">ghi_nhat_ky rồi COMMIT</text><path d="M350 958 H820" fill="none" stroke="#315773" stroke-width="1.6"  marker-end="url(#arr)"/><text x="232.5" y="990" class="msg" text-anchor="middle">Mã phiếu trả</text><path d="M350 1007 H115" fill="none" stroke="#315773" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="22" y="1077" class="sub" text-anchor="start">v_bien_dong chỉ nhập lại dòng TOT. Dòng HONG vẫn được tính hoàn tiền.</text></svg>

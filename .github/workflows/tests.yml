name: POS tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pos_test
          POSTGRES_USER: pos_ci
          POSTGRES_PASSWORD: temporary_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 15
    env:
      POS_TEST_DSN: postgresql://pos_ci:temporary_ci_only@localhost:5432/pos_test
      DATABASE_URL: postgresql://pos_ci:temporary_ci_only@localhost:5432/pos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests/unit -v
      - run: python -m unittest -v kiem_chung kiem_thu_web kiem_tra_43 kiem_thu_chuyen_doi
      - run: python manage.py init
      - run: python manage.py seed
      - run: python manage.py check
